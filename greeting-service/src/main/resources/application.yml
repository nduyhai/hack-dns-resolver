server:
  port: ${SERVER_HTTP_PORT:8081}
  http2:
    enabled: true
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEY_STORE_PASSWORD:123456}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:greeting-service}
    key-password: ${SSL_KEY_PASSWORD:123456}
grpc:
  enabled: true
  port: ${SERVER_GRPC_PORT:6565}
  enableReflection: true

spring:
  application:
    name: greeting-service
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 1m
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_BASE_URL:http://localhost:9411}/api/v2/spans
