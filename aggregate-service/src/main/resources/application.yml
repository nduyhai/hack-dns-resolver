server:
  port: ${SERVER_HTTP_PORT:8080}
spring:
  application:
    name: aggregate-service
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: true
        step: 1m
        url: ${OTLP_BASE_URL:http://localhost:4318/v1/metrics}
    tracing:
      endpoint: ${OTLP_TRACE_URL:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
greeting:
  host: ${GREETING_HOST:localhost}
  port: ${GREETING_PORT:6565}
  ssl: false
  max-retries: 3
  timeout: 2s
  keep-alive: 10m